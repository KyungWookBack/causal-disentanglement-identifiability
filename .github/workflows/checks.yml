name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-data.txt
      - run: python run_reproduce.py --smoke-tests
